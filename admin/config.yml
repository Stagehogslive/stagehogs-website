# Replace YOUR_GITHUB_USERNAME/YOUR_REPOSITORY with the actual repository.
# GitHub OAuth authorization must be configured before /admin can sign in.
backend:
  name: github
  repo: Stagehogslive/stagehogs-website
  branch: main
media_folder: "uploads"
public_folder: "uploads"
collections:
  - name: "shows"
    label: "Upcoming Shows"
    files:
      - label: "Shows"
        name: "shows"
        file: "content/shows.json"
        format: "json"
        fields:
          - label: "Shows"
            name: "shows"
            widget: "list"
            summary: "{{fields.date}} — {{fields.venue}}"
            fields:
              - {label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", time_format: false}
              - {label: "Venue", name: "venue", widget: "string"}
              - {label: "City / Location", name: "city", widget: "string"}
              - {label: "Show Time", name: "time", widget: "string", required: false}
              - {label: "Event / Ticket URL", name: "link", widget: "string", required: false}
  - name: "gallery"
    label: "Photo Gallery"
    files:
      - label: "Gallery Photos"
        name: "gallery"
        file: "content/gallery.json"
        format: "json"
        fields:
          - label: "Photos"
            name: "photos"
            widget: "list"
            summary: "{{fields.alt}}"
            fields:
              - {label: "Photo", name: "image", widget: "image"}
              - {label: "Description", name: "alt", widget: "string"}
